name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained application
        run: >
          dotnet publish AAFSerialCaptureApp.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/win-x64

      - name: Create release archive
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath "AAFSerialCaptureApp-$env:GITHUB_REF_NAME-win-x64.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME "AAFSerialCaptureApp-$env:GITHUB_REF_NAME-win-x64.zip" --generate-notes --title "AAF Serial Capture App $env:GITHUB_REF_NAME"